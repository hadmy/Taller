server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # index.html NUNCA se cachea. Es el unico archivo con nombre fijo: los bundles llevan hash y
  # por eso pueden ser immutable, pero si el navegador se queda con un index.html viejo apunta a
  # bundles que ya no existen -- o, peor, a los de otra app si esa ruta antes la servia otro
  # contenedor. Sin esta cabecera nginx no manda ninguna, y el navegador aplica cache heuristica.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
